<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:1920px;height:1080px;
  overflow:hidden;
  background:#000;
  font-family:'DM Sans',sans-serif;
}

/* BADGE — arriba, centrado horizontalmente */
#badge{
  position:absolute;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:20px;
  padding:22px 80px 22px 56px;
  border-radius:12px;
  background:rgba(204,20,20,.9);
  transition:background .5s;
  white-space:nowrap;
}
.dot{
  width:26px;height:26px;border-radius:50%;
  background:#ff4444;flex-shrink:0;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,68,68,.6)}
  50%{opacity:.7;box-shadow:0 0 0 14px rgba(255,68,68,0)}
}
#badge-text{
  font-size:96px;font-weight:900;color:#fff;
  letter-spacing:8px;text-transform:uppercase;line-height:1;
}

/* HORA — abajo, centrada */
#hora-wrap{
  position:absolute;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  padding:18px 80px;
  background:rgba(20,60,160,.88);
  border-radius:12px;
  white-space:nowrap;
}
#hora{
  font-size:200px;font-weight:900;color:#fff;
  letter-spacing:6px;line-height:1;text-align:center;
}
</style>
</head>
<body>

<div id="badge">
  <span class="dot" id="dot"></span>
  <span id="badge-text">EN VIVO</span>
</div>

<div id="hora-wrap">
  <div id="hora">--:--</div>
</div>

<script>
// ── HORA ACTUAL ──
function tickHora(){
  var n=new Date();
  document.getElementById('hora').textContent=
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
tickHora();
setInterval(tickHora,10000);

// ── BADGE ──
var COLOR_VIVO  = 'rgba(204,20,20,0.9)';
var COLOR_CORTE = 'rgba(160,120,0,0.9)';

function setBadge(text, isCorte){
  document.getElementById('badge-text').textContent = text;
  document.getElementById('badge').style.background = isCorte ? COLOR_CORTE : COLOR_VIVO;
  document.getElementById('dot').style.animation    = isCorte ? 'none' : 'pulse 1.5s ease-in-out infinite';
}

// ── BROADCASTCHANNEL (recibe mensajes del panel) ──
var bc = new BroadcastChannel('3df-stream');
bc.onmessage = function(e){
  var d = e.data;
  if(!d || !d.action) return;
  if(d.action === 'showLive'){
    var t = d.cfg && d.cfg.text ? d.cfg.text : 'EN VIVO';
    setBadge(t, t.indexOf('CORTE') >= 0);
  }
  if(d.action === 'updateLive'){
    var t = d.text || 'EN VIVO';
    setBadge(t, t.indexOf('CORTE') >= 0);
  }
  if(d.action === 'hideLive') setBadge('EN VIVO', false);
};

// ── OBS WEBSOCKET (detecta cambio de escena igual que el panel) ──
var obsCorteScenes = [];
try{
  var st = JSON.parse(localStorage.getItem('3df_state'));
  if(st && st.cs) obsCorteScenes = st.cs;
}catch(e){}

function obsConnect(){
  try{
    var ws = new WebSocket('ws://localhost:4455');
    ws.onopen = function(){ ws.send(JSON.stringify({op:1,d:{rpcVersion:1}})); };
    ws.onmessage = function(e){
      var msg = JSON.parse(e.data);
      // Handshake ok — pedir escena actual
      if(msg.op === 2){
        ws.send(JSON.stringify({op:6,d:{requestType:'GetCurrentProgramScene',requestId:'s1'}}));
      }
      // Cambio de escena en tiempo real
      if(msg.op === 5 && msg.d && msg.d.eventType === 'CurrentProgramSceneChanged'){
        var sc = msg.d.eventData && msg.d.eventData.sceneName || '';
        var ic = obsCorteScenes.some(function(c){ return c && sc.toLowerCase().indexOf(c.toLowerCase()) >= 0; });
        setBadge(ic ? 'EN EL CORTE' : 'EN VIVO', ic);
      }
      // Respuesta a GetCurrentProgramScene
      if(msg.op === 7 && msg.d && msg.d.requestType === 'GetCurrentProgramScene'){
        var sc = msg.d.responseData && msg.d.responseData.currentProgramSceneName || '';
        var ic = obsCorteScenes.some(function(c){ return c && sc.toLowerCase().indexOf(c.toLowerCase()) >= 0; });
        setBadge(ic ? 'EN EL CORTE' : 'EN VIVO', ic);
      }
    };
    ws.onclose = function(){ setTimeout(obsConnect, 5000); };
    ws.onerror = function(){};
  }catch(ex){}
}
obsConnect();
</script>
</body>
</html>
