<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:1920px;height:1080px;
  overflow:hidden;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:60px;
  font-family:'DM Sans',sans-serif;
}

/* BADGE EN VIVO */
#badge{
  display:flex;align-items:center;gap:16px;
  padding:18px 60px 18px 44px;
  border-radius:10px;
  background:rgba(204,20,20,.9);
  transition:background .5s;
}
.dot{
  width:20px;height:20px;border-radius:50%;
  background:#ff4444;flex-shrink:0;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,68,68,.6)}
  50%{opacity:.7;box-shadow:0 0 0 10px rgba(255,68,68,0)}
}
#badge-text{
  font-size:72px;font-weight:900;color:#fff;
  letter-spacing:6px;text-transform:uppercase;line-height:1;
}

/* HORA */
#hora-wrap{
  padding:16px 60px;
  background:rgba(20,60,160,.88);
  border-radius:10px;
}
#hora{
  font-size:180px;font-weight:900;color:#fff;
  letter-spacing:4px;line-height:1;text-align:center;
}
</style>
</head>
<body>

<div id="badge">
  <span class="dot" id="dot"></span>
  <span id="badge-text">EN VIVO</span>
</div>

<div id="hora-wrap">
  <div id="hora">--:--</div>
</div>

<script>
// ── HORA ACTUAL ──
function tickHora(){
  var n=new Date();
  document.getElementById('hora').textContent=
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
tickHora();
setInterval(tickHora,10000);

// ── BADGE ──
function setBadge(text,isCorte){
  document.getElementById('badge-text').textContent=text;
  document.getElementById('badge').style.background=isCorte?'rgba(25,80,170,.92)':'rgba(204,20,20,.9)';
  document.getElementById('dot').style.animation=isCorte?'none':'pulse 1.5s ease-in-out infinite';
}

// ── BROADCASTCHANNEL ──
var bc=new BroadcastChannel('3df-stream');
bc.onmessage=function(e){
  var d=e.data;if(!d||!d.action)return;
  if(d.action==='showLive'){
    var t=d.cfg&&d.cfg.text?d.cfg.text:'EN VIVO';
    setBadge(t,t.indexOf('CORTE')>=0);
  }
  if(d.action==='updateLive'){
    var t=d.text||'EN VIVO';
    setBadge(t,t.indexOf('CORTE')>=0);
  }
  if(d.action==='hideLive') setBadge('EN VIVO',false);
};

// ── OBS WEBSOCKET (detectar escena de corte) ──
var obsCorteScenes=[];
try{var st=JSON.parse(localStorage.getItem('3df_state'));if(st&&st.cs)obsCorteScenes=st.cs;}catch(e){}

function obsConnect(){
  try{
    var ws=new WebSocket('ws://localhost:4455');
    ws.onopen=function(){ws.send(JSON.stringify({op:1,d:{rpcVersion:1}}));};
    ws.onmessage=function(e){
      var msg=JSON.parse(e.data);
      if(msg.op===2){ws.send(JSON.stringify({op:6,d:{requestType:'GetCurrentProgramScene',requestId:'s1'}}));}
      if(msg.op===5&&msg.d&&msg.d.eventType==='CurrentProgramSceneChanged'){
        var sc=msg.d.eventData&&msg.d.eventData.sceneName||'';
        var ic=obsCorteScenes.some(function(c){return c&&sc.toLowerCase().indexOf(c.toLowerCase())>=0;});
        setBadge(ic?'EN EL CORTE':'EN VIVO',ic);
      }
      if(msg.op===7&&msg.d&&msg.d.requestType==='GetCurrentProgramScene'){
        var sc=msg.d.responseData&&msg.d.responseData.currentProgramSceneName||'';
        var ic=obsCorteScenes.some(function(c){return c&&sc.toLowerCase().indexOf(c.toLowerCase())>=0;});
        setBadge(ic?'EN EL CORTE':'EN VIVO',ic);
      }
    };
    ws.onclose=function(){setTimeout(obsConnect,5000);};
    ws.onerror=function(){};
  }catch(ex){}
}
obsConnect();
</script>
</body>
</html>
