<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }

  /* Fondo azul que hace el flash */
  #fondo {
    position: fixed;
    inset: 0;
    background: #206DD6;
    opacity: 0;
    transform: scaleX(0);
    transform-origin: left center;
  }

  /* Contenedor del logo — se arma en el centro */
  #logo-wrap {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 520px;
  }

  /* Logo del canal (PNG) */
  #logo-canal {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    filter: drop-shadow(0 0 30px rgba(0,0,0,0.6)) brightness(0) invert(1);
  }

  /* Partículas / piezas que vuelan */
  .pieza {
    position: fixed;
    opacity: 0;
    pointer-events: none;
  }

  #pieza-3 {
    width: 280px;
    height: 280px;
    left: 960px;
    top: 540px;
    background: white;
    border-radius: 50%;
    /* simula el "3" - círculo blanco grande */
    clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
  }

  #pieza-mic {
    width: 80px;
    height: 120px;
    left: 960px;
    top: 540px;
    background: #1a4fa0;
    border-radius: 40px 40px 0 0;
  }

  #pieza-texto {
    width: 420px;
    height: 80px;
    left: 960px;
    top: 540px;
    background: #1a4fa0;
    border-radius: 8px;
  }

  #pieza-curva {
    width: 200px;
    height: 200px;
    left: 960px;
    top: 540px;
    background: transparent;
    border: 20px solid #206DD6;
    border-radius: 50%;
    clip-path: polygon(0% 50%, 100% 50%, 100% 100%, 0% 100%);
  }

  /* Destellos de luz */
  .destello {
    position: fixed;
    border-radius: 50%;
    background: white;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="fondo"></div>

<!-- Piezas que vuelan -->
<div class="pieza" id="pieza-3"></div>
<div class="pieza" id="pieza-mic"></div>
<div class="pieza" id="pieza-texto"></div>
<div class="pieza" id="pieza-curva"></div>

<!-- Destellos -->
<div class="destello" id="d1" style="width:40px;height:40px;left:960px;top:540px;"></div>
<div class="destello" id="d2" style="width:25px;height:25px;left:960px;top:540px;"></div>
<div class="destello" id="d3" style="width:15px;height:15px;left:960px;top:540px;"></div>

<script>
const DUR = 2200; // duración total ms
const PEAK = 0.4; // momento en que todo está en su pico (pantal cubierta = corte OBS)

// Elementos
const fondo = document.getElementById('fondo');
const logoCanalImg = document.getElementById('logo-canal');
const pieza3 = document.getElementById('pieza-3');
const piezaMic = document.getElementById('pieza-mic');
const piezaTexto = document.getElementById('pieza-texto');
const piezaCurva = document.getElementById('pieza-curva');
const d1 = document.getElementById('d1');
const d2 = document.getElementById('d2');
const d3 = document.getElementById('d3');

// Posiciones de destino (centro de la pantalla ~1920/2, 1080/2)
const CX = 960, CY = 540;

// Posiciones iniciales de cada pieza (vuelan desde afuera)
const piezasConfig = [
  { el: pieza3,      sx: -400, sy: -300,  angle: -45, scale: 0.3,  delay: 0.0 },
  { el: piezaMic,    sx: 2400, sy: -300,  angle: 60,  scale: 0.3,  delay: 0.05 },
  { el: piezaTexto,  sx: -400, sy: 1400,  angle: 30,  scale: 0.3,  delay: 0.1 },
  { el: piezaCurva,  sx: 2400, sy: 1400,  angle: -30, scale: 0.3,  delay: 0.08 },
];

// Posición destino de cada pieza (relativa al centro)
const piezasDestino = [
  { el: pieza3,      tx: CX - 350, ty: CY - 230, rot: 0 },
  { el: piezaMic,   tx: CX - 80,  ty: CY + 60,  rot: 0 },
  { el: piezaTexto, tx: CX - 80,  ty: CY + 20,  rot: 0 },
  { el: piezaCurva, tx: CX + 200, ty: CY - 100, rot: 0 },
];

// Posiciones de destellos
const destelloConfig = [
  { el: d1, sx: CX - 300, sy: CY - 200 },
  { el: d2, sx: CX + 400, sy: CY + 150 },
  { el: d3, sx: CX - 100, sy: CY + 300 },
];

function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeIn(t) { return t * t * t; }
function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
function lerp(a, b, t) { return a + (b - a) * t; }

// Inicializar posiciones iniciales de piezas
piezasConfig.forEach(p => {
  const d = piezasDestino.find(x => x.el === p.el);
  p.el.style.transform = `translate(${p.sx - CX}px, ${p.sy - CY}px) rotate(${p.angle}deg) scale(${p.scale})`;
  p.el.style.opacity = '0';
});

let startTime = null;
let timer = null;

function tick(now) {
  if (!startTime) startTime = now;
  const elapsed = now - startTime;
  const t = Math.min(elapsed / DUR, 1);

  // ── FONDO AZUL ──
  // Entrada: t 0→0.35 → scaleX 0→1 (barrida de izq a derecha)
  // Salida:  t 0.5→0.95 → opacity 1→0
  let fondoOpacity, fondoScaleX;
  if (t < 0.35) {
    fondoScaleX = easeOut(t / 0.35);
    fondoOpacity = 1;
  } else if (t < PEAK) {
    fondoScaleX = 1;
    fondoOpacity = 1;
  } else if (t < 0.9) {
    fondoScaleX = 1;
    fondoOpacity = easeIn(1 - (t - PEAK) / (0.9 - PEAK));
  } else {
    fondoScaleX = 1;
    fondoOpacity = 0;
  }
  fondo.style.opacity = fondoOpacity;
  fondo.style.transform = `scaleX(${fondoScaleX})`;

  // ── PIEZAS: vuelo y ensamble ──
  // Aparecen t 0→0.3 volando desde afuera hacia el centro
  // En t=0.38 están ensambladas y desaparecen (se convierte en el logo)
  piezasConfig.forEach((p, i) => {
    const d = piezasDestino[i];
    
    // Cada pieza tiene un pequeño delay
    const pt = Math.max(0, t - p.delay);
    
    let px, py, rot, scale, opacity;
    
    if (pt < 0.001) {
      opacity = 0;
      px = p.sx; py = p.sy; rot = p.angle; scale = p.scale;
    } else if (pt < 0.32) {
      // Vuelo hacia el centro
      const prog = easeOut(pt / 0.32);
      px = lerp(p.sx, d.tx, prog);
      py = lerp(p.sy, d.ty, prog);
      rot = lerp(p.angle, 0, prog);
      scale = lerp(p.scale, 1, prog);
      opacity = Math.min(1, pt / 0.08);
    } else if (pt < 0.38) {
      // Ensamblado — se quedan en su lugar
      px = d.tx; py = d.ty; rot = 0; scale = 1;
      opacity = 1;
    } else if (pt < 0.5) {
      // Desvanecimiento (el logo los reemplaza)
      const prog = (pt - 0.38) / (0.5 - 0.38);
      px = d.tx; py = d.ty; rot = 0; scale = 1;
      opacity = 1 - easeIn(prog);
    } else {
      opacity = 0;
      px = d.tx; py = d.ty; rot = 0; scale = 1;
    }

    p.el.style.opacity = opacity;
    p.el.style.transform = `translate(${px - CX}px, ${py - CY}px) rotate(${rot}deg) scale(${scale})`;
  });

  // ── LOGO FINAL ──
  // Aparece en t=0.38 cuando las piezas están ensambladas
  // Desaparece en t=0.85
  let logoOpacity, logoScale;
  if (t < 0.38) {
    logoOpacity = 0; logoScale = 0.85;
  } else if (t < 0.55) {
    const prog = (t - 0.38) / (0.55 - 0.38);
    logoOpacity = easeOut(prog);
    logoScale = lerp(0.85, 1.05, easeOut(prog));
  } else if (t < 0.72) {
    logoOpacity = 1; logoScale = 1;
  } else if (t < 0.92) {
    const prog = (t - 0.72) / (0.92 - 0.72);
    logoOpacity = easeIn(1 - prog);
    logoScale = lerp(1, 1.08, easeIn(prog));
  } else {
    logoOpacity = 0; logoScale = 1.08;
  }
  logoCanalImg.style.opacity = logoOpacity;
  logoCanalImg.style.transform = `scale(${logoScale})`;

  // ── DESTELLOS ──
  destelloConfig.forEach((d, i) => {
    // Destellos rápidos en el momento del ensamble (t≈0.35-0.42)
    const dt = t - (0.30 + i * 0.03);
    let op = 0;
    if (dt > 0 && dt < 0.12) {
      op = Math.sin(dt / 0.12 * Math.PI);
    }
    d.el.style.opacity = op;
    // Volar desde borde hacia su posición
    const dx = lerp(d.sx - 200 * (i%2 ? 1 : -1), d.sx, Math.min(1, t / 0.35));
    const dy = lerp(d.sy - 150 * (i%2 ? -1 : 1), d.sy, Math.min(1, t / 0.35));
    d.el.style.left = dx + 'px';
    d.el.style.top = dy + 'px';
  });

  if (t < 1) {
    requestAnimationFrame(tick);
  } else {
    // Reset y esperar para repetir
    fondo.style.opacity = '0';
    logoCanalImg.style.opacity = '0';
    piezasConfig.forEach(p => { p.el.style.opacity = '0'; });
    destelloConfig.forEach(d => { d.el.style.opacity = '0'; });
    
    timer = setTimeout(() => {
      startTime = null;
      requestAnimationFrame(tick);
    }, 600);
  }
}

window.addEventListener('load', () => {
  setTimeout(() => requestAnimationFrame(tick), 200);
});
</script>
